<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Pro Trip anpassen: Titel & Social-Media-Vorschau (der Seitentitel wird
     zusätzlich zur Laufzeit aus js/trip.js gesetzt — diese Tags sind für
     Suchmaschinen & Link-Vorschauen, die kein JavaScript ausführen). -->
<title>Dolce Vita Express – Fährst du mit mir nach Rom?</title>
<meta name="description" content="Ein Nachtzug-Vorschlag: Nürnberg → München → Rom. Vier Tage, alles zu Fuß, unter 90 € Fahrt pro Person.">
<meta name="theme-color" content="#EC0016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:type" content="website">
<meta property="og:title" content="Fährst du mit mir nach Rom? · Dolce Vita Express DV 294">
<meta property="og:description" content="Abends einsteigen, morgens in Rom aufwachen. Tutte le strade portano a Roma.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Alle drei Kachel-Hosts vorverbinden: MapLibre verteilt die Kacheln über
     a/b/c, und js/map.js holt schon vorab welche. DNS + TLS stehen dann. -->
<link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin>
<link rel="preconnect" href="https://b.basemaps.cartocdn.com" crossorigin>
<link rel="preconnect" href="https://c.basemaps.cartocdn.com" crossorigin>
<!-- Ohne crossorigin: Skript und CSS von unpkg werden ohne CORS geladen,
     eine anonyme Vorverbindung würde später nicht wiederverwendet. -->
<link rel="preconnect" href="https://unpkg.com">
<!-- MapLibre ist mit Abstand das größte Paket der Seite. Es steht deshalb
     NICHT mehr als blockierendes <script> im Body: der Preload lässt den
     Download schon beim Parsen anlaufen, eingehängt wird die Bibliothek erst
     von js/map.js — die trifft dann diesen Preload-Cache. Bis dahin baut sich
     die Seite (Hero, Texte, Story-Karten) ungebremst auf. -->
<link rel="preload" as="script" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js">
<!-- Schriften & Karten-CSS blockieren das erste Bild nicht mehr: als
     media="print" geladen (holt der Browser trotzdem sofort), beim onload
     auf "all" umgeschaltet. Ohne JS greift das <noscript> darunter. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,800;0,900;1,800&family=Caveat:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" media="print" onload="this.media='all'">
<noscript>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,800;0,900;1,800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
</noscript>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Generische Hülle: alle Inhalte werden aus js/trip.js gerendert.
     Für eine neue Reise nur js/trip.js kopieren & anpassen (+ <head> oben). -->

<div id="topbar">
  <div class="logo" id="logo" role="button" tabindex="0" aria-label="Überraschung"></div>
  <button id="musicbtn" type="button" aria-label="Musik an/aus" aria-pressed="false">♪</button>
  <div class="cl"></div>
  <div id="ticker"><span class="l"></span><span class="v" id="tv">0,00 €</span></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="yt" aria-hidden="true"></div>

<section id="hero"></section>

<div id="scrolly">
  <div id="stage">
    <div id="map" aria-hidden="true"></div>
    <div id="vignette" aria-hidden="true"></div>
    <div id="loading">Karte lädt …</div>
    <div id="cards"></div>
    <div id="autoctl"><span class="hint">Autopilot</span><button id="autobtn" type="button" aria-label="Autopilot anhalten oder weiterfahren">⏸ Anhalten</button></div>
    <div id="prog"><i id="progfill"></i></div>
  </div>
  <div id="spacer"></div>
</div>

<main id="content"></main>

<section id="rsvp"></section>

<footer id="footer"></footer>

<!-- MapLibre lädt js/map.js selbst nach (siehe Preload im <head>) — die
     Engine startet dadurch, ohne auf die Bibliothek zu warten.
     Reihenfolge wichtig: core (Engine-Kern) → trip (Daten) → mesh (3D-Basis)
     → ui → map → music → story → tee3d/teapot/zucker (brauchen das DOM) -->
<script src="js/core.js"></script>
<script src="js/trip.js"></script>
<script src="js/mesh.js"></script>
<script src="js/ui.js"></script>
<script src="js/map.js"></script>
<!-- Versuch, standardmäßig aus: ?3d=1 hängt extrudierte Häuser an die Karte -->
<script src="js/gebaeude.js"></script>
<script src="js/music.js"></script>
<script src="js/story.js"></script>
<script src="js/tee3d.js"></script>
<script src="js/teapot.js"></script>
<script src="js/zucker.js"></script>
</body>
</html>
